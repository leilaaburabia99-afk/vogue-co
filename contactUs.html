<main class="hero-container">

        </nav>

        <h1>צור קשר</h1>

        <form action="#" method="POST" class="contact-form">
            <div class="form-group">
                <label for="fullname"> שם מלא *</label>
                <input type="text" id="fullname" name="fullname" placeholder="הכניסי את שמך המלא" required>
            </div>

            <div class="form-group">
                <label for="email">  כתובת אימייל *</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="subject">נושא</label>
                <select id="subject" name="subject">
                    <option value="general">פנייה כללית</option>
                    <option value="orders">זימון התייעצות</option>
                    <option value="press">שיתוף פעולה</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">הודעה *</label>
                <textarea id="message" name="message" rows="5" placeholder="כאן כותבים את תוכן ההודעה..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">שליחה</button>
        </form>
    </div>
</main>
