<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <title>Vogue & Co - Build Your Skate Look</title>
    <meta name="description" content="טופס אינטראקטיבי לבניית לוק סקייט">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="styles/myStyle.css" rel="stylesheet">
    <script src="jScripts/JavaScript.js"></script>
</head>

<body>
<div id="container">

    <header>
        <h1>VOGUE & CO</h1>
        <p>BUILD YOUR SKATE LOOK</p>
    </header>

    <main>

        <!-- טופס הבחירה -->
        <section id="formPanel">

            <h2>בנו את הלוק שלכם</h2>

            <p id="formHint">
                יש להזין שם ולבחור סקייטבורד ונעליים.
                בגדים ואביזרים הם לבחירתכם.
            </p>

            <label for="userName">השם שלכם:</label>
            <input type="text" id="userName"
                   placeholder="הכניסו שם"
                   oninput="checkForm(); clearResult()">

            <!-- בחירת סקייטבורד -->
            <h3>בחרו סקייטבורד</h3>

            <div id="boardChoice">
                <label>
                    <input type="radio" id="catBoard"
                           name="boards"
                           value="Cat Skateboard"
                           onclick="showBoard(); checkForm(); clearResult()">
                    סקייטבורד Cat
                </label>

                <label>
                    <input type="radio" id="hauntedBoard"
                           name="boards"
                           value="Haunted Family"
                           onclick="showBoard(); checkForm(); clearResult()">
                    סקייטבורד Haunted Family
                </label>
            </div>

            <!-- בחירת בגדים -->
            <h3>בחרו בגדים</h3>

            <div id="clothesChoice">
                <label>
                    <input type="checkbox" id="skateShirt"
                           onclick="changeItems(); clearResult()">
                    חולצת Thrasher
                </label>

                <label>
                    <input type="checkbox" id="skateTank"
                           onclick="changeItems(); clearResult()">
                    גופייה
                </label>

                <label>
                    <input type="checkbox" id="skateHoodie"
                           onclick="changeItems(); clearResult()">
                    קפוצ'ון סקייט
                </label>

                <label>
                    <input type="checkbox" id="skateShorts"
                           onclick="changeItems(); clearResult()">
                    מכנסיים קצרים
                </label>

                <label>
                    <input type="checkbox" id="skateJeans"
                           onclick="changeItems(); clearResult()">
                    מכנסי Skate
                </label>
            </div>

            <!-- בחירת נעליים -->
            <h3>בחרו נעליים</h3>

            <div id="shoesChoice" dir="ltr">
                <label>
                    <input type="radio" id="oldSkool"
                           name="shoes"
                           value="Vans Old Skool"
                           onclick="showShoes(); checkForm(); clearResult()">
                    Vans Old Skool
                </label>

                <label>
                    <input type="radio" id="nikeSB"
                           name="shoes"
                           value="Nike SB Dunk Low"
                           onclick="showShoes(); checkForm(); clearResult()">
                    Nike SB Dunk Low
                </label>
            </div>

            <!-- בחירת אביזרים -->
            <h3>בחרו אביזרים</h3>

            <div id="accessoriesChoice">
                <label>
                    <input type="checkbox" id="skateCap"
                           onclick="changeItems(); clearResult()">
                    כובע Skate
                </label>

                <label>
                    <input type="checkbox" id="skateChain"
                           onclick="changeItems(); clearResult()">
                    שרשרת
                </label>

                <label>
                    <input type="checkbox" id="skateBackpack"
                           onclick="changeItems(); clearResult()">
                    תיק גב Nike
                </label>
            </div>

            <input type="button" id="confirmButton"
                   value="אישור הבחירה"
                   onclick="confirmLook()" disabled>

            <!-- סיכום הבחירה מתחת לכפתור -->
            <div id="result">
                <h3>הלוק שלכם מוכן!</h3>
                <p>שלום <bdi id="resultName"></bdi>!</p>
                <p id="resultBoard"></p>
                <p id="resultClothes"></p>
                <p id="resultShoes"></p>
                <p id="resultAccessories"></p>
            </div>

        </section>

        <!-- אזור התמונות -->
        <section id="previewPanel">

            <h2>הלוק שלכם</h2>

            <!-- תמונות הסקייטבורדים -->
            <div id="boardsArea">
                <h3>סקייטבורד</h3>

                <div id="boardsImages">
                    <img id="catBoardImage"
                         src="images/skateboard.png"
                         alt="Cat Skateboard">

                    <img id="hauntedBoardImage"
                         src="images/skateboard2.png"
                         alt="Haunted Family Skateboard">
                </div>
            </div>

            <!-- תמונות הבגדים -->
            <div id="clothesArea">
                <h3>בגדים</h3>

                <div id="clothesImages">
                    <img id="shirtImage"
                         src="images/skateShirt.png"
                         alt="Thrasher Shirt">

                    <img id="tankImage"
                         src="images/skateTank.png"
                         alt="Skate Tank Top">

                    <img id="hoodieImage"
                         src="images/skateHoodie.png"
                         alt="Skate Hoodie">

                    <img id="shortsImage"
                         src="images/skateShorts.png"
                         alt="Skate Shorts">

                    <img id="jeansImage"
                         src="images/skateJeans.png"
                         alt="Skate Jeans">
                </div>
            </div>

            <!-- תמונות הנעליים -->
            <div id="shoesArea">
                <h3>נעליים</h3>

                <div id="shoesImages">
                    <img id="oldSkoolImage"
                         src="images/vansShoes.png"
                         alt="Vans Old Skool">

                    <img id="nikeSBImage"
                         src="images/nikeSB.png"
                         alt="Nike SB Dunk Low">
                </div>
            </div>

            <!-- תמונות האביזרים -->
            <div id="accessoriesArea">
                <h3>אביזרים</h3>

                <div id="accessoriesImages">
                    <img id="capImage"
                         src="images/skateCap.png"
                         alt="Skate Cap">

                    <img id="chainImage"
                         src="images/skateChain.png"
                         alt="Silver Chain">

                    <img id="backpackImage"
                         src="images/skateBackpack.png"
                         alt="Nike Backpack">
                </div>
            </div>

        </section>

    </main>

</div>
</body>
</html>
